server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;

  location = /version.json {
    add_header Cache-Control "no-store";
  }

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
}
