name: Verificación y publicación de imagen Docker

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - Dockerfile
      - nginx.conf
      - security-headers.conf
      - patches/**
      - package.json
      - pnpm-lock.yaml
      - .dockerignore
      - .github/workflows/publish_docker_image.yml
      - scripts/check-deployment.mjs
      - scripts/check-security-headers.mjs

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@v3
      - name: Construir versión anterior de prueba
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ulp-website:rollback-test
          build-args: VCS_REF=rollback-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Construir candidata
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ulp-website:verify
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
      - name: Construir base del proxy público
        uses: docker/build-push-action@v6
        with:
          context: .
          target: nginx-base
          load: true
          tags: ulp-website:proxy
          cache-from: type=gha
      - name: Escanear dependencias de la imagen de ejecución
        run: |
          for image in ulp-website:verify ulp-website:proxy; do
            archive="/tmp/ulp-${image##*:}.tar"
            docker save "$image" -o "$archive"
            docker run --rm -v "$archive":/scan/image.tar:ro -v /tmp/ulp-trivy-cache:/root/.cache/trivy aquasec/trivy@sha256:166061a4a15c64a94a3aab430659e2c166dc0815fbc54a222c6d56d64132f552 image --input /scan/image.tar --scanners vuln --exit-code 1
          done
      - name: Probar candidata y vuelta a la versión anterior
        run: |
          docker run -d --name ulp-test -p 127.0.0.1:8080:80 ulp-website:verify
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused --retry-all-errors --max-time 5 http://127.0.0.1:8080/version.json
          docker exec ulp-test nginx -t
          node scripts/check-deployment.mjs http://127.0.0.1:8080 "${{ github.sha }}"
          node scripts/check-security-headers.mjs http://127.0.0.1:8080
          docker rm -f ulp-test
          docker run -d --name ulp-test -p 127.0.0.1:8080:80 ulp-website:rollback-test
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused --retry-all-errors --max-time 5 http://127.0.0.1:8080/version.json
          node scripts/check-deployment.mjs http://127.0.0.1:8080 rollback-test
          node scripts/check-security-headers.mjs http://127.0.0.1:8080
      - name: Login to DockerHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Publicar etiquetas y registrar digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ulp-website
        run: |
          docker tag ulp-website:verify "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker tag ulp-website:verify "$IMAGE:latest"
          docker push "$IMAGE:latest"
          docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Mostrar logs si falla
        if: failure()
        run: docker logs ulp-test
      - name: Limpiar contenedor de prueba
        if: always()
        run: docker rm -f ulp-test || true
