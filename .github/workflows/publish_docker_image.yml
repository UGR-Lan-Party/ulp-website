name: Verificación y publicación de imagen Docker

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - Dockerfile
      - nginx.conf
      - .dockerignore
      - .github/workflows/publish_docker_image.yml
      - scripts/check-deployment.mjs

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@v3
      - name: Construir versión anterior de prueba
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ulp-website:rollback-test
          build-args: VCS_REF=rollback-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Construir candidata
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ulp-website:verify
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
      - name: Probar candidata y vuelta a la versión anterior
        run: |
          docker run -d --name ulp-test -p 127.0.0.1:8080:80 ulp-website:verify
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:8080/version.json
          docker exec ulp-test nginx -t
          node scripts/check-deployment.mjs http://127.0.0.1:8080 "${{ github.sha }}"
          docker rm -f ulp-test
          docker run -d --name ulp-test -p 127.0.0.1:8080:80 ulp-website:rollback-test
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:8080/version.json
          node scripts/check-deployment.mjs http://127.0.0.1:8080 rollback-test
      - name: Login to DockerHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Publicar etiquetas y registrar digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ulp-website
        run: |
          docker tag ulp-website:verify "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker tag ulp-website:verify "$IMAGE:latest"
          docker push "$IMAGE:latest"
          docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Limpiar contenedor de prueba
        if: always()
        run: docker rm -f ulp-test || true
